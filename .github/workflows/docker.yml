# Build the Docker image and publish it to GitHub Container Registry.
#
# Consumers:  docker pull ghcr.io/wyyxdgm/tidiao:latest
# or pinned:   docker pull ghcr.io/wyyxdgm/tidiao:v0.2.0
#
# The image is self-contained: it builds the Vue SPA into public/ and the
# Next.js server in standalone mode, so `docker compose up` needs no Node
# toolchain on the host.
name: Docker Image

on:
  # Tags: publish a version tag + refresh `latest`.
  push:
    tags:
      - "v*"
  # main: publish rolling `latest` + commit-sha tags.
  push:
    branches:
      - main
  # PRs: build only, to prove the Dockerfile still works. Nothing is pushed.
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
